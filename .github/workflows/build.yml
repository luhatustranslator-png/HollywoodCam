name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build Solution
      run: msbuild /p:Configuration=Release /p:GenerateAssemblyInfo=false /p:Nowarn=CS0246,CS0103,CS0012

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HollywoodCam-DLL
        path: "**/bin/Release/*.dll"